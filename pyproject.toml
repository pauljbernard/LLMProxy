[project]
name = "llmproxy"
version = "0.1.0"
description = "Local-first LLM proxy and learning system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "fastapi>=0.115.0",
  "psycopg[binary]>=3.1.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "app",
  "app.api",
  "app.db",
  "app.datasets",
  "app.deployment",
  "app.evaluation",
  "app.integration",
  "app.providers",
  "app.proxy",
  "app.registry",
  "app.schemas",
  "app.services",
  "app.training",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
