apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llmproxy-ingress
  namespace: llmproxy
  labels:
    app.kubernetes.io/name: llmproxy
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: llmproxy
    app.kubernetes.io/environment: base
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llmproxy-api
                port:
                  number: 8000
