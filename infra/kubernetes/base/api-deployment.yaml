apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmproxy-api
  namespace: llmproxy
  labels:
    app.kubernetes.io/name: llmproxy
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: llmproxy
    app.kubernetes.io/environment: base
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: llmproxy
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llmproxy
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: llmproxy
        app.kubernetes.io/environment: base
    spec:
      serviceAccountName: llmproxy
      containers:
        - name: api
          image: llmproxy:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: llmproxy-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
