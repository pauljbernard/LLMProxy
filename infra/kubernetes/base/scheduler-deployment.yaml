apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmproxy-scheduler
  namespace: llmproxy
  labels:
    app.kubernetes.io/name: llmproxy
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: llmproxy
    app.kubernetes.io/environment: base
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llmproxy
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llmproxy
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/part-of: llmproxy
        app.kubernetes.io/environment: base
    spec:
      serviceAccountName: llmproxy
      containers:
        - name: scheduler
          image: llmproxy:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.main"]
          envFrom:
            - configMapRef:
                name: llmproxy-config
