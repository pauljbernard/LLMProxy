services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: llmproxy:dev
    command: python3 -m app.runtime api
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - exports_data:/data/exports
      - datasets_data:/data/datasets
      - models_data:/data/models
      - checkpoints_data:/data/checkpoints
      - reports_data:/data/reports
      - logs_data:/data/logs

  worker:
    image: llmproxy:dev
    command: python3 -m app.runtime worker
    env_file:
      - .env.example
    environment:
      LLMPROXY_WORKER_EXCLUDE_JOB_TYPES: training.run
    depends_on:
      - postgres
      - redis
    volumes:
      - exports_data:/data/exports
      - datasets_data:/data/datasets
      - models_data:/data/models
      - checkpoints_data:/data/checkpoints
      - reports_data:/data/reports
      - logs_data:/data/logs

  training-worker:
    image: llmproxy:dev
    command: python3 -m app.runtime training-worker
    env_file:
      - .env.example
    depends_on:
      - postgres
      - redis
    volumes:
      - exports_data:/data/exports
      - datasets_data:/data/datasets
      - models_data:/data/models
      - checkpoints_data:/data/checkpoints
      - reports_data:/data/reports
      - logs_data:/data/logs

  scheduler:
    image: llmproxy:dev
    command: python3 -m app.runtime scheduler
    env_file:
      - .env.example
    depends_on:
      - postgres
      - redis

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: llmproxy
      POSTGRES_USER: llm
      POSTGRES_PASSWORD: llm
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  exports_data:
  datasets_data:
  models_data:
  checkpoints_data:
  reports_data:
  logs_data:
